name: Frontend CI

on:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Typecheck and build
        working-directory: frontend
        run: npm run build
      - uses: docker/setup-buildx-action@v4
      - name: Build Caddy frontend image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: frontend/Dockerfile
          load: true
          push: false
          tags: game-moyeo-frontend:ci
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
      - name: Validate and start Caddy
        run: |
          docker run --rm game-moyeo-frontend:ci caddy validate --config /etc/caddy/Caddyfile
          docker run -d --name frontend-ci -p 127.0.0.1:18080:80 game-moyeo-frontend:ci
          curl --fail --retry 10 --retry-all-errors --retry-delay 1 --max-time 5 http://127.0.0.1:18080/healthz
      - name: Install test browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Browser smoke tests against Caddy
        working-directory: frontend
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:18080
        run: npm run test:e2e
      - name: Upload browser report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-browser-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7
