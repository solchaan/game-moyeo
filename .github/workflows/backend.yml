name: Backend CI

on:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mariadb:
        image: mariadb:12.2
        env:
          MARIADB_DATABASE: gamemoyeo
          MARIADB_USER: gamemoyeo
          MARIADB_PASSWORD: ci_password
          MARIADB_ROOT_PASSWORD: ci_root_password
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=30
      redis:
        image: redis:8-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=3s --health-retries=20
    env:
      DB_URL: jdbc:mariadb://127.0.0.1:3306/gamemoyeo
      DB_USERNAME: gamemoyeo
      DB_PASSWORD: ci_password
      REDIS_HOST: 127.0.0.1
      SPRING_PROFILES_ACTIVE: local
      MANAGEMENT_OTLP_METRICS_EXPORT_ENABLED: 'false'
      MANAGEMENT_TRACING_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Verify Docker availability for integration tests
        run: docker info
      - name: Test, migrate, generate jOOQ and compile
        run: bash scripts/ci-backend.sh
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            backend/build/reports/tests/
            backend/build/test-results/
            backend/build/ci-startup.log
          retention-days: 7
      - uses: docker/setup-buildx-action@v4
      - name: Build backend runtime image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: backend/Dockerfile
          push: false
          tags: game-moyeo-backend:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
