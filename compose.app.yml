name: game-moyeo-app

services:
  caddy:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APP_HTTP_PORT:-5173}:80"
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:mariadb://mariadb:3306/gamemoyeo
      DB_USERNAME: gamemoyeo
      DB_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in .env.container}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${APP_JWT_SECRET:?Set APP_JWT_SECRET in .env.container}
      CORS_ALLOWED_ORIGINS: ${APP_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      LOGIN_SUCCESS_REDIRECT_URI: ${APP_LOGIN_REDIRECT_URI:-http://localhost:5173/oauth/callback}
      SERVER_FORWARD_HEADERS_STRATEGY: framework
      SPRINGDOC_API_DOCS_ENABLED: "false"
      MANAGEMENT_OTLP_METRICS_EXPORT_ENABLED: "false"
      MANAGEMENT_TRACING_ENABLED: "false"
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    mem_limit: 1g

  mariadb:
    image: mariadb:12.2
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: gamemoyeo
      MARIADB_USER: gamemoyeo
      MARIADB_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in .env.container}
      MARIADB_ROOT_PASSWORD: ${APP_DB_ROOT_PASSWORD:?Set APP_DB_ROOT_PASSWORD in .env.container}
      TZ: UTC
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  mariadb-data:
  redis-data:
  caddy-data:
  caddy-config:
